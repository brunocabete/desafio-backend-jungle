services:
  postgres:
    image: postgres:18-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-app}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  ministack:
    image: ministackorg/ministack:latest
    container_name: ${COMPOSE_PROJECT_NAME:-app}-ministack
    restart: unless-stopped
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      PERSIST_STATE: "1"
    ports:
      - "${MINISTACK_PORT:-4566}:4566"
    volumes:
      - ministack_state:/tmp/ministack-state
      - ./docker/ministack/init:/etc/localstack/init/ready.d
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  ministack_state: