services:
  postgres:
    image: postgres:18-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-app}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: ${COMPOSE_PROJECT_NAME:-app}-pgweb
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

  ministack:
    image: ministackorg/ministack:latest
    container_name: ${COMPOSE_PROJECT_NAME:-app}-ministack
    restart: unless-stopped
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      PERSIST_STATE: "1"
    ports:
      - "${MINISTACK_PORT:-4566}:4566"
    volumes:
      - ministack_state:/tmp/ministack-state
      - ./docker/ministack/init:/etc/localstack/init/ready.d
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-app}-app
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_SQS_QUEUE: ${AWS_SQS_QUEUE:-wager-transactions.fifo}
      AWS_SQS_DLQ_QUEUE: ${AWS_SQS_DLQ_QUEUE:-wager-transactions-dlq.fifo}
      AWS_SQS_EVENTS_QUEUE: ${AWS_SQS_EVENTS_QUEUE:-wager-events.fifo}
      WAGER_SQS_CONSUMER_ENABLED: ${WAGER_SQS_CONSUMER_ENABLED:-true}
      WAGER_SQS_POLL_MS: ${WAGER_SQS_POLL_MS:-1000}
      WAGER_OUTBOX_PUBLISHER_ENABLED: ${WAGER_OUTBOX_PUBLISHER_ENABLED:-true}
      WAGER_OUTBOX_POLL_MS: ${WAGER_OUTBOX_POLL_MS:-1000}
      WAGER_PENDING_WORKER_POLL_MS: ${WAGER_PENDING_WORKER_POLL_MS:-2000}
      WAGER_SQS_SHUTDOWN_TIMEOUT_MS: ${WAGER_SQS_SHUTDOWN_TIMEOUT_MS:-30000}
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/health/live').then(r => { if (!r.ok) process.exit(1) })"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  ministack_state: